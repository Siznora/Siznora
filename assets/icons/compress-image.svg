<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bluePrime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56D8ED"/>
      <stop offset="100%" stop-color="#168DE7"/>
    </linearGradient>
    <linearGradient id="rimSpec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="complexShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0E5A9B" flood-opacity="0.3"/>
    </filter>
    <filter id="symbolNeonBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8CEAFE" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="208" height="208" rx="44" fill="url(#bluePrime)" filter="url(#complexShadow)"/>
  <rect x="24" y="24" width="208" height="208" rx="44" fill="none" stroke="url(#rimSpec)" stroke-width="2.5"/>
  <rect x="64" y="64" width="128" height="128" rx="20" fill="url(#glassFill)" filter="blur(3.5px)"/>

  <g filter="url(#symbolNeonBlue)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Image Card -->
    <rect x="74" y="74" width="108" height="108" rx="16" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="104" cy="104" r="10" fill="#FFFFFF"/>
    <path d="M88 160 L118 128 L140 148 L154 134 L168 160 Z" fill="#FFFFFF"/>

    <!-- Inward Arrows -->
    <path d="M52 52 L80 80 M80 62 V80 H62" stroke="#FFFFFF" stroke-width="8" fill="none"/>
    <path d="M204 52 L176 80 M176 62 V80 H194" stroke="#FFFFFF" stroke-width="8" fill="none"/>
    <path d="M52 204 L80 176 M80 194 V176 H62" stroke="#FFFFFF" stroke-width="8" fill="none"/>
    <path d="M204 204 L176 176 M176 194 V176 H194" stroke="#FFFFFF" stroke-width="8" fill="none"/>
  </g>
</svg>
