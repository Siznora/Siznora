<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E14BF6"/>
      <stop offset="48%" stop-color="#8B40F4"/>
      <stop offset="100%" stop-color="#2D72F2"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3D7FF3" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="ultraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#3A1578" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1A023A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="208" height="208" rx="44" fill="url(#tileGrad)" filter="url(#ultraShadow)"/>
  <rect x="24" y="24" width="208" height="208" rx="44" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="54" y="66" width="112" height="78" rx="10" fill="url(#glassFill)" stroke="#FFFFFF" stroke-width="6.5"/>
    <path d="M90 144 L82 168 H138 L130 144" stroke="#FFFFFF" stroke-width="5.5" fill="none"/>

    <rect x="144" y="102" width="52" height="82" rx="10" fill="#8B40F4" stroke="#FFFFFF" stroke-width="5.5"/>
    <line x1="162" y1="112" x2="178" y2="112" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="170" cy="172" r="3" fill="#FFFFFF"/>
  </g>
</svg>
