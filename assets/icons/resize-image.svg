<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bluePrime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56D8ED"/>
      <stop offset="100%" stop-color="#168DE7"/>
    </linearGradient>
    <linearGradient id="rimSpec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="complexShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0E5A9B" flood-opacity="0.3"/>
    </filter>
    <filter id="symbolNeonBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8CEAFE" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="208" height="208" rx="44" fill="url(#bluePrime)" filter="url(#complexShadow)"/>
  <rect x="24" y="24" width="208" height="208" rx="44" fill="none" stroke="url(#rimSpec)" stroke-width="2.5"/>
  <rect x="80" y="80" width="112" height="112" rx="16" fill="url(#glassFill)" filter="blur(3.5px)"/>

  <g filter="url(#symbolNeonBlue)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame -->
    <rect x="62" y="62" width="132" height="132" rx="14" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="9 7"/>

    <!-- Inner Card -->
    <rect x="74" y="74" width="108" height="108" rx="14" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="104" cy="104" r="9" fill="#FFFFFF"/>
    <path d="M88 160 L118 128 L140 148 L154 134 L168 160 Z" fill="#FFFFFF"/>

    <!-- Handles -->
    <circle cx="62" cy="62" r="10" fill="#168DE7" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="194" cy="62" r="10" fill="#168DE7" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="62" cy="194" r="10" fill="#168DE7" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="194" cy="194" r="10" fill="#168DE7" stroke="#FFFFFF" stroke-width="4.5"/>
  </g>
</svg>
